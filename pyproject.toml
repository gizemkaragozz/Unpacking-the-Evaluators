[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-alignment"
version = "0.1.0"
description = "Reproducibility code for XAI-ground-truth spatial alignment evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.10,<2",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
xai = [
  "captum==0.7.0",
  "torch>=2.0,<3",
]
study = [
  "kaggle>=1.6,<2",
  "monai>=1.3,<2",
  "nibabel>=5,<6",
  "Pillow>=10,<13",
  "scikit-learn>=1.3,<2",
  "torch>=2.0,<3",
  "torchvision>=0.15,<1",
]
plots = [
  "matplotlib>=3.7,<4",
  "plotly>=5.18,<7",
]
dev = [
  "pytest>=7,<9",
]

[tool.setuptools]
packages = ["xai_alignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
